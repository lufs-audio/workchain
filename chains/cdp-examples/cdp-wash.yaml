name: "CDP: Spectral Wash"
description: "A struck metal bar becomes a slow drone. Stretch the analysis frames sixfold in the frequency domain, then bring the result to a streaming level and audit it against the spec."
version: "1.0"
globals:
  lufs_target: -18
steps:
  - name: cdp_transform
    enabled: true
    params:
      effect: stretch.time
      values_json: '{"factor": 6}'
      min_peak_dbfs: -60
  - name: normalization
    enabled: true
    params:
      target_lufs: -18
      two_pass: true
      true_peak: -1.5
  - name: audio_benchmark
    enabled: true
    params: {}
